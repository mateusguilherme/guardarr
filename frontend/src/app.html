<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>guardarr</title>
    %sveltekit.head%
  </head>
  <!-- Preloading on hover would ask MusicBrainz, which is rate limited, for
       the releases of every artist the pointer crosses; tap waits for the
       press. -->

    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
